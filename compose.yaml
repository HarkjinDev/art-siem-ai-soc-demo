# v0.4 unified stack; Wazuh opt-in via --profile wazuh
name: art-siem-ai-soc
services:
  soc-demo:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    ports:
    - 127.0.0.1:${SOC_PORT:-8088}:8000
    env_file: .env
    environment:
      DB_PATH: /data/demo.sqlite
      SAMPLES_PATH: /app/samples/events.json
      WAZUH_CA_FILE: /app/certs/root-ca.pem
    volumes:
    - soc-data:/data
    networks:
    - soc-net
  slack-bot:
    profiles:
    - slack
    build:
      context: .
      dockerfile: slack/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      SOC_API_URL: http://soc-demo:8000
      BOT_DB_PATH: /data/slack.sqlite
    volumes:
    - soc-data:/data
    depends_on:
    - soc-demo
    networks:
    - soc-net
  docker-agent:
    profiles:
    - ai
    build:
      context: https://github.com/docker/docker-agent.git#${DOCKER_AGENT_GIT_REF:-main}
      dockerfile: Dockerfile
    entrypoint:
    - /docker-agent
    command:
    - serve
    - api
    - /agents/soc-agent.yaml
    - --listen
    - 0.0.0.0:8080
    - --auth-token
    - ${DOCKER_AGENT_TOKEN}
    - --session-db
    - /data/sessions.sqlite
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    volumes:
    - ./agents:/agents:ro
    - agent-data:/data
    networks:
    - soc-net
    restart: unless-stopped
  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.5
    hostname: wazuh.manager
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
    - ${WAZUH_BIND_IP:-127.0.0.1}:1514:1514
    - ${WAZUH_BIND_IP:-127.0.0.1}:1515:1515
    environment:
    - INDEXER_URL=https://wazuh.indexer:9200
    - INDEXER_USERNAME=admin
    - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:?Set WAZUH_INDEXER_PASSWORD}
    - FILEBEAT_SSL_VERIFICATION_MODE=full
    - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
    - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
    - SSL_KEY=/etc/ssl/filebeat.key
    - API_USERNAME=wazuh-wui
    - API_PASSWORD=${WAZUH_API_PASSWORD:?Set WAZUH_API_PASSWORD}
    volumes:
    - wazuh_api_configuration:/var/ossec/api/configuration
    - wazuh_etc:/var/ossec/etc
    - wazuh_logs:/var/ossec/logs
    - wazuh_queue:/var/ossec/queue
    - wazuh_var_multigroups:/var/ossec/var/multigroups
    - wazuh_integrations:/var/ossec/integrations
    - wazuh_active_response:/var/ossec/active-response/bin
    - wazuh_agentless:/var/ossec/agentless
    - wazuh_wodles:/var/ossec/wodles
    - filebeat_etc:/etc/filebeat
    - filebeat_var:/var/lib/filebeat
    - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
    - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
    - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
    - ./wazuh/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
    profiles:
    - wazuh
    networks:
    - soc-net
  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.5
    hostname: wazuh.indexer
    restart: always
    ports: []
    environment:
    - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
    - wazuh-indexer-data:/var/lib/wazuh-indexer
    - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
    - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
    - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
    - ./wazuh/config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
    - ./wazuh/config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
    - ./wazuh/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
    - ./wazuh/config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
    profiles:
    - wazuh
    networks:
    - soc-net
  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.5
    hostname: wazuh.dashboard
    restart: always
    ports:
    - 127.0.0.1:${WAZUH_DASHBOARD_PORT:-8443}:5601
    environment:
    - INDEXER_USERNAME=admin
    - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:?Set WAZUH_INDEXER_PASSWORD}
    - WAZUH_API_URL=https://wazuh.manager
    - DASHBOARD_USERNAME=kibanaserver
    - DASHBOARD_PASSWORD=${WAZUH_KIBANA_PASSWORD:?Set WAZUH_KIBANA_PASSWORD}
    - API_USERNAME=wazuh-wui
    - API_PASSWORD=${WAZUH_API_PASSWORD:?Set WAZUH_API_PASSWORD}
    volumes:
    - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
    - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
    - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
    - ./wazuh/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
    - ./wazuh/config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
    - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
    - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
    - wazuh.indexer
    profiles:
    - wazuh
    networks:
    - soc-net
volumes:
  soc-data: null
  agent-data: null
  wazuh_api_configuration: null
  wazuh_etc: null
  wazuh_logs: null
  wazuh_queue: null
  wazuh_var_multigroups: null
  wazuh_integrations: null
  wazuh_active_response: null
  wazuh_agentless: null
  wazuh_wodles: null
  filebeat_etc: null
  filebeat_var: null
  wazuh-indexer-data: null
  wazuh-dashboard-config: null
  wazuh-dashboard-custom: null
networks:
  soc-net:
    driver: bridge
