<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ART-SIEM-AI SOC Demo v5.1</title>
<style>
:root{color-scheme:dark}body{font:15px system-ui,'Malgun Gothic',sans-serif;margin:0;background:#0b1220;color:#e5e7eb}main{max-width:1150px;margin:auto;padding:24px}h1{font-size:25px;margin-bottom:6px}.hint,.meta{color:#9ca3af}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,select{padding:10px 14px;border-radius:8px;border:1px solid #4b5563;background:#1f2937;color:white;cursor:pointer}button.primary{background:#1d4ed8;border:0}button:disabled{opacity:.4;cursor:not-allowed}.item{background:#111c30;border:1px solid #374151;margin:12px 0;padding:16px;border-radius:12px}.item h3{margin:9px 0}.flag{display:inline-block;border:1px solid #475569;border-radius:14px;padding:3px 9px;font-size:12px;margin-right:6px}.flag.error{color:#fca5a5}.flag.ok{color:#86efac}.analysis{line-height:1.6;overflow-wrap:anywhere;white-space:normal}.analysis h3,.analysis h4{font-size:15px;color:#93c5fd;margin:12px 0 4px}.analysis p{margin:6px 0}.analysis ul{margin:5px 0;padding-left:22px}.analysis pre{white-space:pre-wrap;background:#0b1220;padding:10px;overflow:auto}.analysis code{color:#7dd3fc}details{border-top:1px solid #334155;margin-top:10px;padding-top:8px}summary{cursor:pointer;font-weight:650}.actions{display:flex;gap:8px;margin-top:12px}#status{min-height:2em;color:#a5b4fc} .errorline{color:#fca5a5}
</style></head><body><main>
<h1>ART · SIEM · AI SOC Demo <small class="hint">v5.1</small></h1>
<p class="hint">자동 수집 및 이벤트 선별 상태를 확인할 수 있습니다. 실제 Wazuh Alert와 데모 이벤트를 구분합니다. 실패 이벤트는 개별적으로 재분석할 수 있습니다.</p>
<div class="bar"><button class="primary" onclick="replay()">샘플 재생</button><button onclick="load()">새로고침</button><button onclick="importWazuh()">실제 Wazuh 최근 10건 가져오기</button><button onclick="drafts()">Sigma 초안 목록</button><button onclick="pollNow()">자동 수집 1회 실행</button><button onclick="queueNow()">AI 대기열 1회 실행</button>
<select id="source" onchange="render()"><option value="all">전체 출처</option><option value="wazuh-real">실제 Wazuh</option><option value="synthetic">합성 테스트</option><option value="sample">샘플</option></select>
<select id="state" onchange="render()"><option value="all">전체 상태</option><option value="ai-error">AI 실패만</option><option value="docker-agent">AI 성공만</option></select></div>
<p id="collector" class="hint">자동 수집 상태 확인 중…</p><p id="status" role="status">준비</p><div id="list"></div></main>
<script>
const el=document.getElementById('list'),st=document.getElementById('status');let items=[];
function safe(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function localTime(x){const d=new Date(x);return Number.isNaN(d.getTime())?safe(x):safe(new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d))+' KST';}
function rich(x){let t=safe(x).replace(/\\\*/g,'*').replace(/\\([#*_`])/g,'$1');let lines=t.split(/\r?\n/),out=[],inList=false;function close(){if(inList){out.push('</ul>');inList=false}}for(let line of lines){if(!line.trim()){close();continue}let m=line.match(/^\s{0,4}(#{1,5})\s+(.+)/);if(m){close();out.push('<h4>'+m[2]+'</h4>');continue}let li=line.match(/^\s*[-*]\s+(.+)/);if(li){if(!inList){out.push('<ul>');inList=true}out.push('<li>'+li[1]+'</li>');continue}close();out.push('<p>'+line+'</p>')}close();return out.join('').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');}
async function api(path,opts){const r=await fetch(path,opts),raw=await r.text();let d;try{d=JSON.parse(raw)}catch(_){throw Error('HTTP '+r.status+': '+raw.slice(0,130))}if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d));return d}
function render(){const src=document.getElementById('source').value,state=document.getElementById('state').value;const rows=items.filter(x=>(src==='all'||x.source===src)&&(state==='all'||x.mode===state));el.innerHTML=rows.map(x=>`<article class="item"><div class="meta">${localTime(x.ts)} · Level ${safe(x.level)} · ${safe(x.category)}</div><h3>${safe(x.name)}</h3><span class="flag">${x.source==='wazuh-real'?'실제 Wazuh':(x.source==='synthetic'?'합성 테스트':'샘플')}</span><span class="flag ${x.mode==='ai-error'?'error':'ok'}">${safe(x.mode)}</span><p>ATT&CK: ${safe(x.technique)} · 판정: ${safe(x.verdict)}</p><details><summary>근거 필드 / 가설 / 추가 확인</summary><div class='analysis'><p>확인된 원본 필드</p><ul>${(x.evidence?.facts||[]).map(f=>'<li>'+safe(f.field)+': '+safe(f.value)+'</li>').join('')}</ul><p>가설: ${safe((x.evidence?.hypotheses||[]).join(' / '))}</p><p>추가 확인: ${safe((x.evidence?.follow_up||[]).join(' / '))}</p></div></details><details ${x.mode==='ai-error'?'open':''}><summary>L1 분석</summary><div class="analysis">${rich(x.l1)}</div></details><details><summary>L2 심층 분석</summary><div class="analysis">${rich(x.l2)}</div></details><div class="actions">${x.mode==='ai-error'?`<button onclick="retry('${safe(x.id)}')">AI 재분석</button>`:''}${x.category==='endpoint_security'&&x.mode==='docker-agent'?`<button onclick="sigma('${safe(x.id)}')">L3 Sigma 초안</button>`:''}</div></article>`).join('')||'<p>선택 조건에 해당하는 이벤트가 없습니다.</p>';st.textContent=rows.length+'건 표시 / 전체 '+items.length+'건';}
async function load(){try{items=await api('/api/events');render()}catch(e){st.textContent='조회 실패: '+e.message}}
async function go(path){st.textContent='처리 중…';try{const d=await api(path,{method:'POST'});await load();st.textContent=d.message||`${d.count||0}건 처리`;if(d.errors?.length)st.textContent+=' / 일부 실패 '+d.errors.length+'건'}catch(e){st.textContent='실패: '+e.message}}
async function pollNow(){await go('/api/collector/poll');await collectorStatus()}async function queueNow(){await go('/api/collector/queue/run');await collectorStatus()}async function collectorStatus(){try{const x=await api('/api/collector/status');document.getElementById('collector').textContent='자동 수집 '+(x.enabled?'ON':'OFF')+' · 간격 '+x.interval_seconds+'초 · 배치 '+x.batch+'건 · 회당 AI '+x.ai_per_poll+'건 · 최종 실행 '+(x.last_poll?localTime(x.last_poll):'없음')+(x.last_error?' · 오류: '+x.last_error:'')}catch(e){document.getElementById('collector').textContent='수집 상태 확인 실패: '+e.message}}
async function replay(){await go('/api/replay')}async function importWazuh(){await go('/api/import-wazuh')}
async function retry(id){st.textContent='AI 재분석 진행 중…';try{const d=await api('/api/events/'+encodeURIComponent(id)+'/retry',{method:'POST'});await load();st.textContent=d.message}catch(e){st.textContent='재분석 실패: '+e.message}}
async function sigma(id){st.textContent='L3 생성 중…';try{const d=await api('/api/events/'+encodeURIComponent(id)+'/sigma-draft',{method:'POST'});st.textContent='Sigma 초안 '+d.status;alert(d.draft)}catch(e){st.textContent='L3 오류: '+e.message}}
async function drafts(){try{const a=await api('/api/sigma-drafts');el.innerHTML=a.map(x=>`<article class="item"><small>${localTime(x.created_at)} · ${safe(x.status)}</small><pre>${safe(x.draft)}</pre></article>`).join('')||'초안 없음';st.textContent=a.length+'건의 초안'}catch(e){st.textContent='초안 조회 실패: '+e.message}}
load();collectorStatus();
</script></body></html>
